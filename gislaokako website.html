<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Redeemer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: rgb(255, 255, 0);
        }

        .error {
            color: rgb(129, 0, 0);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gislaokako's Code Redeemer</h2>
    <p>Enter your giggling code below!!</p>

    <input type="text" id="codeInput" placeholder="Enter code">
    <br>
    <button onclick="redeemCode()">Redeem</button>

    <p id="message"></p>
</div>

<script>
    const correctCodes = [
    "Q9X2MZ7K0LP4V8N1TA6C5R3BD",
    "H7K0PZ9X1M4Q8N6T2V5R3LDAJ",
    "T3N8VQ1Z0K6P9M2X7R5A4LC8B",
    "M6R1X9P0K2Z7N4V8Q3T5L7A0C",
    "A5C9T0R7X2M8P1V6K3ZQ4N8LDB"
    ];

    function redeemCode() {
        const userCode = document.getElementById("codeInput").value.trim();
        const message = document.getElementById("message");

        message.className = "";
        message.textContent = "Checking.";

        setTimeout(() => {
            message.textContent = "Checking..";
        }, 300);

        setTimeout(() => {
            message.textContent = "Checking...";
        }, 600);

        setTimeout(() => {
            message.textContent = "Checking.";
        }, 900);

        setTimeout(() => {
            message.textContent = "Checking..";
        }, 1200);

        setTimeout(() => {
            message.textContent = "Checking...";
        }, 1500);

        setTimeout(() => {
            message.textContent = "Checking.";
        }, 1800);

        setTimeout(() => {
            if (correctCodes.includes(userCode)) {
                message.textContent = "Code redeemed! =)";
                message.className = "success";
            } else {
                message.textContent = "Invalid code!";
                message.className = "error";
            }
        }, 2100);
}
</script>

</body>
</html>
