<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Redeemer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: rgb(255, 255, 0);
        }

        .error {
            color: rgb(129, 0, 0);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gislaokako's Code Redeemer</h2>
    <p>Enter your giggling code below!!</p>

    <input type="text" id="codeInput" placeholder="Enter code">
    <br>
    <button onclick="redeemCode()">Redeem</button>

    <p id="message"></p>
</div>

<script>
    const correctCode = "A7KQ2MZ0XJP4B8N1CY0LT5R";

    function redeemCode() {
        const userCode = document.getElementById("codeInput").value.trim();
        const message = document.getElementById("message");

        message.textContent = "Checking...";
        message.className = "";

        setTimeout(() => {
            if (userCode === correctCode) {
                message.textContent = "Code redeemed! =)";
                message.className = "success";
            } else {
                message.textContent = "Invalid code!";
                message.className = "error";
            }
        }, 2500);
    }
</script>

</body>
</html>
